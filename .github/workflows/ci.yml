name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同一 PR 或分支有新提交时取消仍在运行的旧检查。
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 构建、类型检查与单元/契约测试（不需要数据库和 Redis，集成测试自动跳过）。
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # 版本取 package.json 的 packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify

  # 集成测试：PostgreSQL（pgvector）与 Redis 服务容器，每个测试使用临时 schema 和唯一队列名。
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_DB: nyzrag
          POSTGRES_USER: nyzrag
          POSTGRES_PASSWORD: nyzrag
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nyzrag -d nyzrag"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DATABASE_URL: postgresql://nyzrag:nyzrag@localhost:5432/nyzrag
      REDIS_URL: redis://localhost:6379
      NYZ_INTEGRATION_TEST: "1"
      NYZ_AUTH_REDIS_TEST: "1"
      NYZ_RATE_LIMIT_REDIS_TEST: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # 与部署一致，vector 扩展预先建在 public：否则首个迁移会把它建进该测试的临时 schema（search_path 在前），
      # 并行的其他测试找不到 vector 类型，该 schema 删除时扩展也随之删除。
      - name: Create vector extension
        run: docker exec ${{ job.services.postgres.id }} psql -U nyzrag -d nyzrag -c "CREATE EXTENSION IF NOT EXISTS vector"
      - run: pnpm test
