# 生产部署（1Panel 服务器）：使用本地打包、上传导入的镜像，不在服务器上构建。步骤见 docs/deploy-1panel.md。
# 与本文件同目录放 .env（模板 deploy/.env.example）。
# PostgreSQL（含 pgvector）与 Redis 用 1Panel 应用商店中各项目共用的实例，api 与 worker 经 1Panel 的网络访问它们。
name: nyz-rag

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

x-backend: &backend
  env_file: .env
  environment:
    NODE_ENV: production
    API_PORT: 3000
    DOCUMENT_QUEUE_NAME: ${DOCUMENT_QUEUE_NAME:-nyz-rag-document-processing}
    DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL in .env}
    REDIS_URL: ${REDIS_URL:?set REDIS_URL in .env}
    # OpenResty（host 网络）经端口映射进入容器时，来源是某个所在网络的网关（容器在两个网络中，由 Docker 选择），
    # 所以两个网段都要信任；web/admin 的 Nginx 在本项目网络内。
    TRUSTED_PROXIES: ${NYZ_SUBNET:?set NYZ_SUBNET in .env},${NYZ_SHARED_SUBNET:?set NYZ_SHARED_SUBNET in .env}
    # 服务器内存小：让 V8 早些回收，避免触及容器内存上限。
    NODE_OPTIONS: --max-old-space-size=256
  networks: [default, shared]
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true
  pull_policy: never
  restart: unless-stopped
  stop_grace_period: 60s
  mem_limit: 384m
  logging: *logging

services:
  api:
    <<: *backend
    image: nyz-rag-api:${NYZ_VERSION:?set NYZ_VERSION in .env}
    ports:
      - "127.0.0.1:${NYZ_API_PORT:-3010}:3000"
    # /ready 确认数据库与 Redis 可用（/health 只说明进程在响应）；共用实例不可用时 API 不健康，web/admin 随之不启动。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 30s
      retries: 3

  worker:
    <<: *backend
    image: nyz-rag-worker:${NYZ_VERSION:?set NYZ_VERSION in .env}
    # 投递器每轮成功后写心跳文件，30 秒内没有更新即不健康（启动时先执行迁移）。
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    image: nyz-rag-web:${NYZ_VERSION:?set NYZ_VERSION in .env}
    pull_policy: never
    ports:
      - "127.0.0.1:${NYZ_WEB_PORT:-5010}:8080"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

  admin:
    image: nyz-rag-admin:${NYZ_VERSION:?set NYZ_VERSION in .env}
    pull_policy: never
    ports:
      - "127.0.0.1:${NYZ_ADMIN_PORT:-5011}:8080"
    depends_on:
      api: { condition: service_healthy }
    restart: unless-stopped
    mem_limit: 64m
    logging: *logging

networks:
  default:
    ipam:
      config:
        - subnet: ${NYZ_SUBNET:?set NYZ_SUBNET in .env}
  # 1Panel 应用（PostgreSQL、Redis）所在的网络，由 1Panel 创建。
  shared:
    external: true
    name: ${NYZ_SHARED_NETWORK:-1panel-network}
