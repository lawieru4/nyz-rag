name: nyz-rag

x-backend: &backend
  env_file: .env
  environment:
    NODE_ENV: production
    API_PORT: 3000
    NYZ_STORE_PATH: /data/knowledge.json
    DOCUMENT_QUEUE_NAME: ${DOCUMENT_QUEUE_NAME:-nyz-rag-document-processing}
  volumes:
    - ./.nyz-data:/data
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true
  restart: unless-stopped
  stop_grace_period: 60s

services:
  api:
    <<: *backend
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-3001}:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *backend
    build:
      context: .
      target: worker

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-5175}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      target: admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5176}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    profiles: [standalone]
    image: pgvector/pgvector:pg18
    environment:
      POSTGRES_DB: nyzrag
      POSTGRES_USER: nyzrag
      POSTGRES_PASSWORD: nyzrag
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - postgres18_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nyzrag -d nyzrag"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    profiles: [standalone]
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:56380:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres18_data:
  redis_data:
