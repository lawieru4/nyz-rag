# 本地容器方式：只含 api/worker/web/admin。PostgreSQL 与 Redis 用本机共用的基础设施（D:/baolf/infra，见 README），
# 连接串写在根目录 .env（localhost 由 docker/start.mjs 改写为 host.docker.internal）。
name: nyz-rag

x-backend: &backend
  env_file: .env
  environment:
    NODE_ENV: production
    API_PORT: 3000
    DOCUMENT_QUEUE_NAME: ${DOCUMENT_QUEUE_NAME:-nyz-rag-document-processing}
  extra_hosts:
    - "host.docker.internal:host-gateway"
  init: true
  restart: unless-stopped
  stop_grace_period: 60s

services:
  api:
    <<: *backend
    build:
      context: .
      target: api
    ports:
      - "127.0.0.1:${API_PORT:-3010}:3000"
    # /ready 确认数据库与 Redis 可用（/health 只说明进程在响应）。
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 3s
      start_period: 10s
      retries: 3

  worker:
    <<: *backend
    build:
      context: .
      target: worker
    # 投递器每轮成功后写心跳文件，30 秒内没有更新即不健康（启动时先执行迁移）。
    healthcheck:
      test: ["CMD", "node", "apps/worker/dist/healthcheck.js"]
      interval: 15s
      timeout: 5s
      start_period: 60s
      retries: 3

  web:
    build:
      context: .
      target: web
    ports:
      - "127.0.0.1:${WEB_PORT:-5010}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  admin:
    build:
      context: .
      target: admin
    ports:
      - "127.0.0.1:${ADMIN_PORT:-5011}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
